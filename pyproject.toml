# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-cloudflare"
version = "0.0.1"
description = "Native SoT for Cloudflare intent: DNS (incl. DDNS), cloudflared tunnels/ingress, WAF rules"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jameson" }]
keywords = ["netbox", "netbox-plugin", "cloudflare", "dns", "cloudflared", "tunnel", "waf", "ddns"]
# PEP 639: the SPDX `license` expression above is authoritative; a `License ::`
# classifier alongside it is rejected by setuptools>=77, so it is intentionally omitted.
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = ["netbox-plugin-dns"]

[project.urls]
Repository = "https://github.com/JamesonRGrieve/netbox-cloudflare"

[tool.setuptools.packages.find]
include = ["netbox_cloudflare*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox.settings"
python_files = ["test_*.py"]
addopts = "-v"
